name: camera_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  panorama_stitcher:
    path: ./packages/panorama_stitcher  

  cupertino_icons: ^1.0.8
  camera: ^0.11.2
  permission_handler: ^11.3.1
  ar_flutter_plugin_updated:
    path: ./packages/ar_flutter_plugin_updated
  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  easy_localization: ^3.0.8
  flutter_screenutil_plus: ^1.5.0
  vector_math: ^2.1.4
  path_provider: ^2.1.3
  
  # Google ML Kit paketleri
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_pose_detection: ^0.14.0
  flutter_tts: ^4.2.5
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  # Generator paketleri
  hive_generator: ^2.0.1
  build_runner: 2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/ar/

